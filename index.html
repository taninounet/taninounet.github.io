<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Omelette</title>

  <style>
    @font-face{
      font-family:"Alphabetized Cassette Tapes";
      src:url("./Alphabetized Cassette Tapes.ttf") format("truetype");
      font-weight:400;
      font-style:normal;
    }

    :root{
      --bg:#F7DD80;
      --text:#000;

      /* sizing */
      --fs-title: clamp(56px, 5.6vw, 88px);
      --fs-subtitle: clamp(34px, 3.2vw, 50px);
      --fs-goal: clamp(20px, 2.0vw, 30px);

      --egg-w: min(80vw, 640px);

      /* THIS is the "couple pixels" gap above and below the egg */
      --egg-gap: 10px; /* tweak to taste: 8px / 10px / 12px */

      /* motion */
      --ease: cubic-bezier(.2,.8,.2,1);
      --t: 620ms;
      --blur-out: 3px;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family:"Alphabetized Cassette Tapes","Comic Sans MS",system-ui,sans-serif;
      color:var(--text);
    }

    /* stable centering */
    #app{
      position:relative;
      width:100vw;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      max-width:1400px;
    }

    /* shared overlay layer: the SAME "break some eggs" element on both pages */
    #sharedLayer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:50;
    }

    #breakText{
      position:absolute;
      left:50%;
      top:0;
      transform: translate(-50%, 0);
      font-size:var(--fs-title);
      line-height:1.05;
      text-align:center;
      padding:0 16px;
      white-space:nowrap;
      will-change: transform, opacity;
      transition: transform var(--t) var(--ease), opacity var(--t) ease;
    }

    /* anchor placeholder reserves space so nothing re-centers */
    .breakAnchor{
      width:100%;
      height: var(--break-h, 0px);
    }

    /* ---------- INTRO ---------- */
    #introScene{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      will-change: transform, opacity, filter;
      transition: transform var(--t) var(--ease), opacity var(--t) ease, filter var(--t) ease;
    }

    /* Use explicit gap above egg like your screenshot */
    #topText{
      font-size:var(--fs-title);
      line-height:1.05;
      text-align:center;
      padding:0 16px;
      margin: 0 0 var(--egg-gap) 0;
    }

    #eggHolder{ width:var(--egg-w); }
    #eggHolder svg{ width:100%; height:auto; display:block; }

    /* anchor sits exactly under egg, separated by same gap */
    #introBreakAnchor{
      margin-top: var(--egg-gap);
    }

    /* ---------- GOALS ---------- */
    #goalsScene{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      opacity:0;
      pointer-events:none;
      transform: translateY(80px);
      will-change: transform, opacity, filter;
      transition: transform var(--t) var(--ease), opacity var(--t) ease, filter var(--t) ease;
    }

    #goalsHeader{
      padding-top:18px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    #goalsBody{
      flex:1;
      min-height:0;
      display:flex;
      justify-content:center;
      align-items:center; /* keep goals centered regardless of zoom */
      overflow-y:auto;
      padding:10px 14px 14px;
      box-sizing:border-box;
      scrollbar-gutter: stable both-edges;
    }

    #goalsPanel{
      width:min(96vw, 1200px);
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
      padding:2px 0 10px;
    }

    .section{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }

    .subtitle{
      font-size:var(--fs-subtitle);
      line-height:1.05;
      text-align:center;
    }

    .goalsRow{
      width:100%;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:nowrap;
      overflow-x:auto;
      padding:3px 6px 2px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:thin;
    }

    .goal{ flex:0 0 auto; min-width:110px; text-align:center; }
    .goalLabel{ font-size:var(--fs-goal); line-height:1.05; white-space:nowrap; }

    /* tiny progress bars */
    .bar{
      margin:6px auto 0;
      width:30px;
      height:3px;
      background:#fff;
      border:2px solid #000;
      border-radius:999px;
      overflow:hidden;
    }
    .fill{ height:100%; width:calc(var(--pct, 0) * 1%); background:#000; }

    /* ---------- MODE (everything moves + fades together) ---------- */
    body.mode-goals #introScene{
      opacity:0;
      transform: translateY(-90px);
      filter: blur(var(--blur-out));
      pointer-events:none;
    }

    body.mode-goals #goalsScene{
      opacity:1;
      transform: translateY(0);
      filter: blur(0);
      pointer-events:auto;
    }

    @media (prefers-reduced-motion: reduce){
      #introScene, #goalsScene, #breakText{ transition:none !important; }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="stage">
      <div id="sharedLayer">
        <!-- SINGLE shared element that moves from under egg to goals title -->
        <div id="breakText">you gotta break some eggs</div>
      </div>

      <!-- INTRO -->
      <div id="introScene">
        <div id="topText">you wanna make an omelette</div>
        <div id="eggHolder" aria-hidden="true"></div>

        <!-- this anchor defines the "below egg" position of breakText -->
        <div id="introBreakAnchor" class="breakAnchor" aria-hidden="true"></div>
      </div>

      <!-- GOALS -->
      <div id="goalsScene" aria-hidden="true">
        <div id="goalsHeader">
          <!-- this anchor defines the "title top" position of the SAME breakText -->
          <div id="goalsBreakAnchor" class="breakAnchor" aria-hidden="true"></div>
        </div>
        <div id="goalsBody">
          <div id="goalsPanel"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { EGG_ART } from "./egg-art.js";

    // egg SVG
    document.getElementById("eggHolder").innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="egg">
        <g>
          <path d="${EGG_ART.whitePath}" fill="#F7FCF6" stroke="#000" stroke-width="12"
                stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${EGG_ART.yolk.cx}" cy="${EGG_ART.yolk.cy}" r="${EGG_ART.yolk.r}"
                  fill="#F5C966" stroke="#000" stroke-width="12"/>
          <ellipse cx="${EGG_ART.eyeL.cx}" cy="${EGG_ART.eyeL.cy}" rx="${EGG_ART.eyeL.rx}" ry="${EGG_ART.eyeL.ry}" fill="#000"/>
          <ellipse cx="${EGG_ART.eyeR.cx}" cy="${EGG_ART.eyeR.cy}" rx="${EGG_ART.eyeR.rx}" ry="${EGG_ART.eyeR.ry}" fill="#000"/>
          <path d="${EGG_ART.mouthPath}" fill="none" stroke="#000" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    `;

    // ====== EDIT THESE PERCENTAGES (0–100) ======
    const PROGRESS = {
      "analysis ii": 0, "prob n stats": 0, "theo inf": 0,
      "sub20 5km": 0, "handstand": 0, "roundoff-spring": 0, "muscle-up": 0, "six pack": 0,
      "splits": 0, "dunk": 0, "back lever": 0, "dragonfly": 0,
      "german": 0, "italian": 0, "portuguese": 0, "korean": 0, "chinese": 0,
      "dice problems": 0, "green book": 0, "heard on the street": 0, "quant job qna": 0,
      "akuna 101": 0, "akuna 201": 0, "optiver book": 0, "optiver c.k.": 0, "poker m.c.": 0,
      "leetcode 150": 0, "eth algo lab": 0,
      "eprog": 0, "data n algs": 0, "linalg": 0, "diskmath": 0, "paraprog": 0,
      "algos n prob": 0, "analysis i": 0, "ddca": 0
    };

    const SECTIONS = [
      { subtitle: "exam egg",  goals: ["analysis ii","prob n stats","theo inf"] },
      { subtitle: "abs egg",   goals: ["sub20 5km","handstand","roundoff-spring","muscle-up","six pack","splits","dunk","back lever","dragonfly"] },
      { subtitle: "spy egg",   goals: ["german","italian","portuguese","korean","chinese"] },
      { subtitle: "quant egg", goals: ["dice problems","green book","heard on the street","quant job qna","akuna 101","akuna 201","optiver book","optiver c.k.","poker m.c."] },
      { subtitle: "coder egg", goals: ["leetcode 150","eth algo lab"] },
      { subtitle: "mit egg",   goals: ["eprog","data n algs","linalg","diskmath","paraprog","algos n prob","analysis i","ddca"] }
    ];

    function clampPct(v){
      const n = Number(v);
      if (!Number.isFinite(n)) return 0;
      return Math.max(0, Math.min(100, n));
    }

    function renderGoals(){
      document.getElementById("goalsPanel").innerHTML = SECTIONS.map(sec => {
        const goals = sec.goals.map(name => {
          const pct = clampPct(PROGRESS[name] ?? 0);
          return `
            <div class="goal">
              <div class="goalLabel">${name}</div>
              <div class="bar"><div class="fill" style="--pct:${pct}"></div></div>
            </div>
          `;
        }).join("");
        return `
          <div class="section">
            <div class="subtitle">${sec.subtitle}</div>
            <div class="goalsRow">${goals}</div>
          </div>
        `;
      }).join("");
    }
    renderGoals();

    // --- shared breakText moves between two anchors (under egg -> goals title) ---
    const app = document.getElementById("app");
    const breakText = document.getElementById("breakText");
    const introAnchor = document.getElementById("introBreakAnchor");
    const goalsAnchor = document.getElementById("goalsBreakAnchor");
    const goalsScene  = document.getElementById("goalsScene");

    let goalsMode = false;

    function syncAnchorHeights(){
      const h = Math.ceil(breakText.getBoundingClientRect().height);
      document.documentElement.style.setProperty("--break-h", h + "px");
    }

    function placeBreakText(animate){
      const anchor = goalsMode ? goalsAnchor : introAnchor;

      const appRect = app.getBoundingClientRect();
      const aRect = anchor.getBoundingClientRect();
      const btRect = breakText.getBoundingClientRect();

      // Center breakText within anchor box
      const y = (aRect.top - appRect.top) + (aRect.height - btRect.height) / 2;

      if (!animate){
        const prev = breakText.style.transition;
        breakText.style.transition = "none";
        breakText.style.transform = `translate(-50%, ${y}px)`;
        requestAnimationFrame(() => { breakText.style.transition = prev; });
      } else {
        breakText.style.transform = `translate(-50%, ${y}px)`;
      }
    }

    function layoutNow(){
      syncAnchorHeights();
      placeBreakText(false);
    }

    // initial
    requestAnimationFrame(() => requestAnimationFrame(layoutNow));

    // keep centered under zoom/resize
    window.addEventListener("resize", () => {
      requestAnimationFrame(() => requestAnimationFrame(layoutNow));
    });

    function enterGoals(){
      if (goalsMode) return;
      goalsMode = true;
      document.body.classList.add("mode-goals");
      goalsScene.setAttribute("aria-hidden","false");

      syncAnchorHeights();
      placeBreakText(true);
    }

    function leaveGoals(){
      if (!goalsMode) return;
      goalsMode = false;
      document.body.classList.remove("mode-goals");

      syncAnchorHeights();
      placeBreakText(true);

      window.setTimeout(() => {
        goalsScene.setAttribute("aria-hidden","true");
      }, 650);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown"){ e.preventDefault(); enterGoals(); }
      if (e.key === "ArrowUp"){   e.preventDefault(); leaveGoals(); }
    }, { passive:false });
  </script>
</body>
</html>
