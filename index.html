<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Egg Pun Graphic</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#f3f4f6; /* page bg (change if you want) */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap{
      width:min(680px, 92vw);
      padding: 24px;
    }
    /* Makes the SVG scale nicely */
    svg{
      width:100%;
      height:auto;
      display:block;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.12);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Original egg-pun doodle (SVG). Free to use/modify. -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Cute egg doodle with a pun">
      <defs>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="0.6" result="b"/>
          <feBlend in="SourceGraphic" in2="b" mode="normal"/>
        </filter>

        <style>
          .bg { fill: #f6dc7a; }           /* warm yellow */
          .ink { stroke: #1a1a1a; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; fill: none; }
          .ink2 { stroke: #1a1a1a; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
          .white { fill: #fbfbf7; }
          .yolk { fill: #f2b64e; }
          .txt { fill: #1a1a1a; font-family: ui-rounded, "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif; font-weight: 700; }
          .top { font-size: 52px; }
          .bot { font-size: 54px; }
          .small { font-size: 22px; opacity: 0.6; font-weight: 650; }
        </style>
      </defs>

      <!-- background -->
      <rect class="bg" x="0" y="0" width="800" height="800"/>

      <!-- little doodle sparkles -->
      <g filter="url(#soft)" opacity="0.9">
        <path class="ink" d="M120 210 l18 0 M129 201 l0 18" />
        <path class="ink" d="M675 585 l18 0 M684 576 l0 18" />
        <path class="ink" d="M630 210 l14 0 M637 203 l0 14" />
      </g>

      <!-- top text -->
      <text class="txt top" x="400" y="150" text-anchor="middle">have an egg-stra nice day!</text>

      <!-- egg -->
      <g transform="translate(0,10) rotate(-3 400 390)" filter="url(#soft)">
        <path class="white ink"
          d="M400 250
             C300 245, 235 320, 250 410
             C265 500, 350 555, 400 555
             C450 555, 535 500, 550 410
             C565 320, 500 245, 400 250 Z"/>

        <path class="ink"
          d="M270 420 C250 440, 262 470, 295 478
             M530 420 C550 440, 538 470, 505 478" />

        <circle class="yolk ink2" cx="400" cy="385" r="78"/>

        <circle cx="380" cy="380" r="6" fill="#1a1a1a"/>
        <circle cx="420" cy="380" r="6" fill="#1a1a1a"/>
        <path d="M392 405 Q400 412 408 405" stroke="#1a1a1a" stroke-width="7" fill="none" stroke-linecap="round"/>

        <circle cx="360" cy="402" r="10" fill="#e48f8f" opacity="0.35"/>
        <circle cx="440" cy="402" r="10" fill="#e48f8f" opacity="0.35"/>

        <text class="txt small" x="400" y="595" text-anchor="middle">made for your site ✦</text>
      </g>

      <!-- bottom text -->
      <text class="txt bot" x="400" y="700" text-anchor="middle">hope your day turns out sunny-side up!</text>
    </svg>

  </div>
</body>
</html>
