    const motion = new Proxy({}, {

        return React.forwardRef(function MotionFallbackComponent(props, ref) {
          const {
            initial,
            animate,
            exit,
            transition,
            variants,
            whileHover,
            whileTap,
            layout,
            layoutId,
            ...rest
          } = props;
          return React.createElement(element, { ...rest, ref });
        });

function validatePrototypeData() {
  console.assert(swaps.length === 3, "Expected three suggested swaps.");
  swaps.forEach((swap) => {
    console.assert(Boolean(swap.from && swap.to), "Each swap needs from/to product names.");
    console.assert(Boolean(swap.fromImage && swap.toImage), `Swap ${swap.from} needs product images.`);
    console.assert(Boolean(swap.priceChip && swap.gradeLift && swap.note), `Swap ${swap.from} needs price, grade and note data.`);
  });
  receipts.forEach((receipt) => {
    console.assert(Boolean(receipt.total), `Receipt ${receipt.shop} needs a total.`);
    console.assert(Array.isArray(receipt.items) && receipt.items.length > 0, `Receipt ${receipt.shop} needs items.`);
  });
}

  };

function priceTone(priceChip) {
  const match = String(priceChip || "").match(/([+-])\s*CHF\s*([0-9]+(?:\.[0-9]+)?)/i);
  if (!match) return "priceNeutral";
  const amount = parseFloat(match[2]);
  const signedAmount = match[1] === "-" ? -amount : amount;

  // Colour scale: large savings = green, tiny changes = yellow, large added costs = red.
  if (signedAmount <= -3) return "priceWinStrong";
  if (signedAmount < -1) return "priceWinSoft";
  if (signedAmount < 1) return "priceNeutral";
  if (signedAmount < 3) return "priceCostSoft";
  return "priceCostStrong";
}

                  <div>
                    <p className="text-xl font-black tracking-[-0.04em]">Clara Meier</p>
                    <p className="text-xs font-black text-white/55">Zurich · GreenBasket basic profile</p>
                  </div>
                </div>
              </div>
              <div className="mt-3 grid gap-2">
                {[
                  ["Connected shops", "Coop, Migros, Aldi"],
                  ["Weekly goal", "Improve one basket"],
                  ["Diet preference", "Flexible"],
                  ["Notifications", "Weekly summary only"],
                ].map(([label, value]) => (
                  <div key={label} className="flex items-center justify-between rounded-[20px] bg-white p-3 shadow-sm">
                    <p className="text-xs font-black text-[#65725f]">{label}</p>
                    <p className="text-sm font-black text-[#17351f]">{value}</p>
                  </div>
                ))}
              </div>
            </Modal>

            <Modal open={modal === "overview"} title="30-day product overview" onClose={() => setModal(null)}>
              <div className="rounded-[26px] bg-[#17351f] p-5 text-white">
                <p className="text-sm font-black text-white/55">Average score</p>
                <div className="flex items-end gap-2"><p className="text-6xl font-black tracking-[-0.08em]">B+</p><p className="mb-3 text-sm font-black text-white/55">{average}/100</p></div>
                <p className="text-sm font-semibold text-white/75">All products read from connected Coop, Migros and Aldi baskets.</p>
              </div>
              <div className="mt-3 grid grid-cols-2 gap-2">
                {allItems.map((item) => (
                  <div key={`${item.shop}-${item.name}`} className="rounded-[19px] bg-white p-3 shadow-sm">
                    <div className="flex items-center justify-between">{item.image ? <ProductThumb src={item.image} alt={item.name} compact /> : <span className="text-xl">{item.icon}</span>}<StoreLogo shop={item.shop} small /></div>
                    <p className="mt-2 text-[11px] font-black leading-tight">{item.name}</p>
                    <p className="mt-1 text-[9px] font-bold text-[#65725f]">{item.driver} · {item.date}</p>
                  </div>
                ))}
              </div>
            </Modal>

            <Modal open={modal === "purchaseList"} title="Historical baskets" onClose={() => setModal(null)}>
              <div className="space-y-2">
                {purchaseHistory.map((receipt, index) => (
                  <button key={`${receipt.shop}-${receipt.date}-${index}`} onClick={() => openReceipt(receipt)} className="grid w-full grid-cols-[46px_1fr_62px_38px] items-center gap-3 rounded-[20px] bg-white p-3 text-left shadow-sm">
                    <StoreLogo shop={receipt.shop} small />
                    <div><p className="text-sm font-black">{receipt.shortDate || receipt.date}</p><p className="text-[10px] font-bold text-[#65725f]">{receipt.shop}</p></div>
                    <p className="text-xs font-black">{receipt.total}</p>
                    <p className="text-lg font-black text-[#2f7b42]">{receipt.grade}</p>
                  </button>
                ))}
              </div>
            </Modal>

            <Modal open={modal === "reward"} title="Rewards & coupons" onClose={() => setModal(null)}>
              <div className="grid gap-3">
                {[
                  ["Oatly oat yoghurt", "CHF 1.50 off", "Triggered by dairy-heavy baskets. Partner pays for promoted lower-impact trial."],
                  ["Migros Bio apples", "20% off seasonal produce", "Price-neutral seasonal swap for imported berries."],
                  ["VBZ monthly pass raffle", "CHF 50 transport credit", "Unlocked if Zurich reaches the collective swap target."],
                  ["Coop Karma range", "Buy 2, save CHF 3", "Promotes plant-based alternatives without pushing larger basket size."],
                ].map(([title, offer, body], index) => (
                  <div key={title} className="rounded-[22px] bg-white p-4 shadow-sm">
                    <div className="flex items-center justify-between"><Pill tone={index === 0 ? "yellow" : "green"}>{offer}</Pill><span className="text-[10px] font-black text-[#65725f]">{index === 0 ? "Sponsored" : "Reward"}</span></div>
                    <p className="mt-3 text-sm font-black">{title}</p>
                    <p className="mt-1 text-xs font-semibold leading-relaxed text-[#65725f]">{body}</p>
                  </div>
                ))}
              </div>
            </Modal>

            <Modal open={modal === "promotion"} title="Product offer" onClose={() => setModal(null)}>
              <div className="rounded-[28px] bg-white p-5 shadow-sm">
                <div className="flex items-start justify-between gap-4">
                  <div><Pill tone="yellow">Sponsored</Pill><h3 className="mt-4 text-2xl font-black tracking-[-0.06em]">CHF 1.50 off Oatly oat yoghurt</h3></div>
                  <img src={logos.Oatly} alt="Oatly logo" className="h-14 max-w-[150px] object-contain" />
                </div>
                <p className="mt-3 text-sm font-semibold leading-relaxed text-[#65725f]">You bought dairy yoghurt in recent baskets. Try a lower-impact breakfast swap this week at Coop or Migros.</p>
                <div className="mt-4 rounded-[22px] bg-[#ddf3c8] p-4"><p className="text-sm font-black">Valid until Sunday</p><p className="mt-1 text-xl font-black">Applied automatically at checkout</p><p className="mt-1 text-xs font-bold text-[#52604d]">No code needed.</p></div>
              </div>
            </Modal>

            <Modal open={modal === "scan"} title="Receipt camera" onClose={() => setModal(null)} dark>
              <div className="rounded-[28px] border-2 border-dashed border-white/35 bg-white/5 p-5 text-center">
                <div className="mx-auto w-56 rounded-2xl bg-[#f6eedf] p-4 text-left font-mono text-[12px] leading-6 text-[#203025] shadow-xl">
                  <p>COOP ZURICH HB</p><p>Prix Garantie beef  12.45</p><p>Imported berries  4.20</p><p>Dairy yoghurt  2.80</p><p>Pasta  1.70</p><p className="mt-2 border-t border-[#b7aa90] pt-2 font-black">TOTAL CHF 23.25</p>
                </div>
                <button onClick={() => openReceipt(receipts[0])} className="mt-5 rounded-full bg-[#b8ea8a] px-6 py-3 text-sm font-black text-[#12321d]">Analyse receipt</button>
              </div>
            </Modal>

            <Modal open={modal === "receipt"} title="Receipt analysis" onClose={() => setModal(null)}>
              <ReceiptAnalysis receipt={selectedReceipt} onSwap={setSwap} />
            </Modal>

            <Modal open={Boolean(swap)} title="Swap detail" onClose={() => setSwap(null)}>
              {swap && (
                <div>
                  <div className="rounded-[26px] bg-white p-5 shadow-sm">
                    <div className="grid grid-cols-[1fr_32px_1fr] items-center gap-3">
                      <img src={swap.fromImage} alt={swap.from} className="h-20 w-full object-contain" />
                      <div className="text-center text-2xl font-black text-[#2f7b42]">→</div>
                      <img src={swap.toImage} alt={swap.to} className="h-20 w-full object-contain" />
                    </div>
                    <h3 className="mt-4 text-xl font-black tracking-[-0.04em]">{swap.from} → {swap.to}</h3>
                    <p className="mt-2 text-sm font-semibold leading-relaxed text-[#65725f]">{swap.note}</p>
                    <div className="mt-4 flex flex-wrap gap-2"><Pill tone={priceTone(swap.priceChip)}>{swap.priceChip}</Pill><Pill tone="score">{swap.gradeLift}</Pill>{swap.coupon && <Pill tone="coupon">Coupon</Pill>}</div>
                  </div>
                  {swap.coupon && (
                    <div className="mt-3 rounded-[26px] bg-[#e6f3ff] p-4 shadow-sm">
                      <div className="flex items-start justify-between gap-4">
                        <div>
                          <Pill tone="coupon">Coupon</Pill>
                          <h3 className="mt-3 text-xl font-black leading-[0.95] tracking-[-0.05em] text-[#0f2f47]">{swap.coupon.title}</h3>
                        </div>
                        <img src={logos.Oatly} alt="Oatly logo" className="h-11 max-w-[120px] object-contain" />
                      </div>
                      <p className="mt-3 text-xs font-semibold leading-relaxed text-[#47677c]">{swap.coupon.detail}</p>
                      <div className="mt-3 rounded-[20px] bg-white/75 p-3">
                        <p className="text-xs font-black text-[#16415f]">{swap.coupon.valid}</p>
                        <p className="mt-1 text-base font-black leading-tight text-[#0f2f47]">{swap.coupon.checkout}</p>
                        <p className="mt-1 text-[10px] font-bold text-[#47677c]">{swap.coupon.code}</p>
                      </div>
                    </div>
                  )}
                </div>
              )}
      </Modal>
    </div>
  );
}

function GreenBasketPresentationPreview() {
  return <Home />;
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<GreenBasketPresentationPreview />);
  </script>
</body>
</html>
