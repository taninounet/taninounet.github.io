<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Omelette</title>

  <style>
    /* Put Alphabetized Cassette Tapes.ttf next to this file */
    @font-face{
      font-family:"Alphabetized Cassette Tapes";
      src:url("./Alphabetized Cassette Tapes.ttf") format("truetype");
      font-weight:400;
      font-style:normal;
    }

    :root{
      --bg:#F7DD80;
      --text:#000;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden; /* prevent arrow keys from scrolling page */
      font-family:"Alphabetized Cassette Tapes","Comic Sans MS",system-ui,sans-serif;
      color:var(--text);
    }

    #app{
      position:relative;
      width:100vw;
      height:100vh;
    }

    /* ---------- INTRO (centered, tighter spacing) ---------- */
    #introScene{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px; /* closer */
      transition:opacity 380ms ease;
    }

    .introLine{
      text-align:center;
      line-height:1.05;
      font-size:56px;
      padding:0 16px;
    }

    #eggHolder{
      width:min(72vw, 500px);
      margin:2px 0; /* keep tight */
    }

    #eggHolder svg{
      width:100%;
      height:auto;
      display:block;
    }

    /* The ONE shared element that moves to the top */
    #breakText{
      will-change: transform;
    }

    /* ---------- GOALS SCENE ---------- */
    #goalsScene{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      opacity:0;
      pointer-events:none;
      transition:opacity 380ms ease;
    }

    /* This is where the SAME breakText element is moved into */
    #goalsHeader{
      padding-top:20px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    /* Remaining area */
    #goalsBody{
      flex:1;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:flex-start; /* so you can see more sections */
      overflow-y:auto;        /* if screen is short */
      padding:10px 14px 16px; /* tighter */
      box-sizing:border-box;
    }

    #goalsPanel{
      width:min(96vw, 1200px);
      display:flex;
      flex-direction:column;
      gap:16px;              /* less margin between sections */
      align-items:center;
      padding:4px 0 10px;
    }

    .section{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;               /* tighter */
    }

    .subtitle{
      font-size:34px;        /* bigger + readable but not huge */
      line-height:1.05;
      text-align:center;
    }

    .goalsRow{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:12px;
      flex-wrap:nowrap;      /* one line */
      overflow-x:auto;
      overflow-y:hidden;
      padding:4px 6px 2px;   /* tighter */
      -webkit-overflow-scrolling:touch;
      scrollbar-width:thin;
    }

    .goal{
      flex:0 0 auto;
      min-width:110px;
      text-align:center;
    }

    .goalLabel{
      font-size:20px;        /* bigger */
      line-height:1.05;
      white-space:nowrap;
    }

    /* EVEN TINIER progress bars */
    .bar{
      margin:6px auto 0;
      width:40px;
      height:4px;
      background:#fff;
      border:2px solid #000;
      border-radius:999px;
      overflow:hidden;
    }

    .fill{
      height:100%;
      width:calc(var(--pct, 0) * 1%);
      background:#000;
    }

    /* ---------- MODE TRANSITIONS ---------- */
    body.mode-goals #introScene{
      opacity:0;
      pointer-events:none;
    }

    body.mode-goals #goalsScene{
      opacity:1;
      pointer-events:auto;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- INTRO -->
    <div id="introScene">
      <div class="introLine" id="topText">you wanna make an omelette</div>

      <div id="eggHolder" aria-hidden="true"></div>

      <!-- THIS is the element that will animate up and become title -->
      <div class="introLine" id="breakText">you gotta break some eggs</div>
    </div>

    <!-- GOALS -->
    <div id="goalsScene" aria-hidden="true">
      <div id="goalsHeader"></div>
      <div id="goalsBody">
        <div id="goalsPanel"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { EGG_ART } from "./egg-art.js";

    // --- egg SVG (no background) ---
    const eggSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="egg">
        <g>
          <path d="${EGG_ART.whitePath}"
                fill="#F7FCF6" stroke="#000" stroke-width="12"
                stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${EGG_ART.yolk.cx}" cy="${EGG_ART.yolk.cy}" r="${EGG_ART.yolk.r}"
                  fill="#F5C966" stroke="#000" stroke-width="12"/>
          <ellipse cx="${EGG_ART.eyeL.cx}" cy="${EGG_ART.eyeL.cy}" rx="${EGG_ART.eyeL.rx}" ry="${EGG_ART.eyeL.ry}" fill="#000"/>
          <ellipse cx="${EGG_ART.eyeR.cx}" cy="${EGG_ART.eyeR.cy}" rx="${EGG_ART.eyeR.rx}" ry="${EGG_ART.eyeR.ry}" fill="#000"/>
          <path d="${EGG_ART.mouthPath}" fill="none" stroke="#000" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    `;
    document.getElementById("eggHolder").innerHTML = eggSVG;

    // ====== EDIT THESE PERCENTAGES (0–100) ======
    const PROGRESS = {
      "analysis ii": 0,
      "prob n stats": 0,
      "theo inf": 0,

      "sub20 5km": 0,
      "handstand": 0,
      "roundoff-spring": 0,
      "muscle-up": 0,
      "six pack": 0,
      "splits": 0,
      "dunk": 0,
      "back lever": 0,
      "dragonfly": 0,

      "german": 0,
      "italian": 0,
      "portuguese": 0,
      "korean": 0,
      "chinese": 0,

      "dice problems": 0,
      "green book": 0,
      "heard on the street": 0,
      "quant job qna": 0,
      "akuna 101": 0,
      "akuna 201": 0,
      "optiver book": 0,
      "optiver c.k.": 0,
      "poker m.c.": 0,

      "leetcode 150": 0,
      "eth algo lab": 0,

      "eprog": 0,
      "data n algs": 0,
      "linalg": 0,
      "diskmath": 0,
      "paraprog": 0,
      "algos n prob": 0,
      "analysis i": 0,
      "ddca": 0
    };

    const SECTIONS = [
      { subtitle: "exam egg",  goals: ["analysis ii", "prob n stats", "theo inf"] },
      { subtitle: "abs egg",   goals: ["sub20 5km", "handstand", "roundoff-spring", "muscle-up", "six pack", "splits", "dunk", "back lever", "dragonfly"] },
      { subtitle: "spy egg",   goals: ["german", "italian", "portuguese", "korean", "chinese"] },
      { subtitle: "quant egg", goals: ["dice problems", "green book", "heard on the street", "quant job qna", "akuna 101", "akuna 201", "optiver book", "optiver c.k.", "poker m.c."] },
      { subtitle: "coder egg", goals: ["leetcode 150", "eth algo lab"] },
      { subtitle: "mit egg",   goals: ["eprog", "data n algs", "linalg", "diskmath", "paraprog", "algos n prob", "analysis i", "ddca"] }
    ];

    function clampPct(v){
      const n = Number(v);
      if (!Number.isFinite(n)) return 0;
      return Math.max(0, Math.min(100, n));
    }

    function renderGoals(){
      const panel = document.getElementById("goalsPanel");
      panel.innerHTML = SECTIONS.map(sec => {
        const goals = sec.goals.map(name => {
          const pct = clampPct(PROGRESS[name] ?? 0);
          return `
            <div class="goal">
              <div class="goalLabel">${name}</div>
              <div class="bar"><div class="fill" style="--pct:${pct}"></div></div>
            </div>
          `;
        }).join("");

        return `
          <div class="section">
            <div class="subtitle">${sec.subtitle}</div>
            <div class="goalsRow">${goals}</div>
          </div>
        `;
      }).join("");
    }
    renderGoals();

    // ====== FLIP animation for the SAME breakText element ======
    const breakText = document.getElementById("breakText");
    const introScene = document.getElementById("introScene");
    const goalsHeader = document.getElementById("goalsHeader");

    function moveWithFLIP(targetParent){
      const first = breakText.getBoundingClientRect();
      targetParent.appendChild(breakText);
      const last = breakText.getBoundingClientRect();

      const dx = first.left - last.left;
      const dy = first.top - last.top;

      breakText.animate(
        [
          { transform: `translate(${dx}px, ${dy}px)` },
          { transform: "translate(0, 0)" }
        ],
        { duration: 520, easing: "cubic-bezier(.2,.8,.2,1)" }
      );
    }

    // ====== Mode toggle ======
    let goalsMode = false;

    function setMode(on){
      goalsMode = !!on;

      // move the SAME title element to the correct place with FLIP
      if (goalsMode) {
        moveWithFLIP(goalsHeader);
      } else {
        moveWithFLIP(introScene); // goes back under egg
      }

      document.body.classList.toggle("mode-goals", goalsMode);
      document.getElementById("goalsScene").setAttribute("aria-hidden", String(!goalsMode));
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown"){ e.preventDefault(); setMode(true); }
      if (e.key === "ArrowUp"){   e.preventDefault(); setMode(false); }
    }, { passive:false });
  </script>
</body>
</html>
