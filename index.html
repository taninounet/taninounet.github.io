<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Omelette</title>

  <style>
    @font-face{
      font-family:"Alphabetized Cassette Tapes";
      src:url("./Alphabetized Cassette Tapes.ttf") format("truetype");
      font-weight:400;
      font-style:normal;
    }

    :root{
      --bg:#F7DD80;
      --text:#000;

      --fs-title: clamp(56px, 5.6vw, 88px);
      --fs-subtitle: clamp(34px, 3.2vw, 50px);
      --fs-goal: clamp(20px, 2.0vw, 30px);

      --egg-w: min(80vw, 640px);
      --egg-gap: -40px;

      --ease: cubic-bezier(.2,.8,.2,1);
      --t-move: 560ms;
      --t-fade: 420ms;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family:"Alphabetized Cassette Tapes","Comic Sans MS",system-ui,sans-serif;
      color:var(--text);
    }

    #app{
      position:relative;
      width:100vw;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      max-width:1400px;
    }

    #sharedLayer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:50;
    }

    #breakText{
      position:absolute;
      left:50%;
      top:0;
      transform:translate(-50%,0);
      font-size:var(--fs-title);
      line-height:1.05;
      white-space:nowrap;
      transition:transform var(--t-move) var(--ease), opacity var(--t-fade) ease;
      will-change:transform;
    }

    .breakAnchor{ height:var(--break-h,0px); }

    #introScene{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      transition:transform var(--t-move) var(--ease), opacity var(--t-fade) ease;
    }

    #topText{
      font-size:var(--fs-title);
      margin:0 0 var(--egg-gap) 0;
      text-align:center;
    }

    #eggHolder{ width:var(--egg-w); }
    #eggHolder svg{ width:100%; display:block; }

    #introBreakAnchor{ margin-top:var(--egg-gap); }

    #goalsScene{
      position:absolute;
      inset:0;
      opacity:0;
      pointer-events:none;
      transform:translateY(80px);
      transition:transform var(--t-move) var(--ease), opacity var(--t-fade) ease;
    }

    body.mode-goals #introScene{
      opacity:0;
      transform:translateY(-90px);
      pointer-events:none;
    }

    body.mode-goals #goalsScene{
      opacity:1;
      transform:none;
      pointer-events:auto;
    }
  </style>
</head>

<body>
<div id="app">
  <div class="stage">
    <div id="sharedLayer">
      <div id="breakText">you gotta break some eggs</div>
    </div>

    <div id="introScene">
      <div id="topText">you wanna make an omelette</div>
      <div id="eggHolder"></div>
      <div id="introBreakAnchor" class="breakAnchor"></div>
    </div>

    <div id="goalsScene">
      <div id="goalsBreakAnchor" class="breakAnchor"></div>
    </div>
  </div>
</div>

<script type="module">
  import { EGG_ART } from "./egg-art.js";

  document.getElementById("eggHolder").innerHTML = `
    <svg viewBox="0 0 1080 1080">
      <g>
        <path d="${EGG_ART.whitePath}" fill="#F7FCF6" stroke="#000" stroke-width="12"/>
        <circle cx="${EGG_ART.yolk.cx}" cy="${EGG_ART.yolk.cy}" r="${EGG_ART.yolk.r}"
                fill="#F5C966" stroke="#000" stroke-width="12"/>
      </g>
    </svg>
  `;

  const app = document.getElementById("app");
  const breakText = document.getElementById("breakText");
  const introAnchor = document.getElementById("introBreakAnchor");
  const goalsAnchor = document.getElementById("goalsBreakAnchor");

  let goalsMode = false;
  let cachedIntroY = null; // 🔒 FIX

  function syncAnchorHeight(){
    document.documentElement.style.setProperty(
      "--break-h",
      breakText.getBoundingClientRect().height + "px"
    );
  }

  function computeY(anchor){
    const appRect = app.getBoundingClientRect();
    const a = anchor.getBoundingClientRect();
    const b = breakText.getBoundingClientRect();
    return (a.top - appRect.top) + (a.height - b.height)/2;
  }

  function placeBreakText(animate){
    let y;

    if (!goalsMode) {
      if (cachedIntroY === null) {
        cachedIntroY = computeY(introAnchor);
      }
      y = cachedIntroY;          // ✅ restore exact original
    } else {
      y = computeY(goalsAnchor);
    }

    if (!animate) {
      breakText.style.transition = "none";
      breakText.style.transform = `translate(-50%, ${y}px)`;
      requestAnimationFrame(() =>
        breakText.style.transition = ""
      );
    } else {
      breakText.style.transform = `translate(-50%, ${y}px)`;
    }
  }

  function layoutNow(animate=false){
    syncAnchorHeight();
    placeBreakText(animate);
  }

  requestAnimationFrame(() => requestAnimationFrame(() => layoutNow(false)));
  window.addEventListener("resize", () => layoutNow(false));

  function enterGoals(){
    if (goalsMode) return;
    goalsMode = true;
    document.body.classList.add("mode-goals");
    layoutNow(true);
  }

  function leaveGoals(){
    if (!goalsMode) return;
    goalsMode = false;
    document.body.classList.remove("mode-goals");
    layoutNow(true);
  }

  window.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") enterGoals();
    if (e.key === "ArrowUp") leaveGoals();
  });
</script>
</body>
</html>
