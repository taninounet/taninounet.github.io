<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Omelette</title>

  <style>
    @font-face{
      font-family:"Alphabetized Cassette Tapes";
      src:url("./Alphabetized Cassette Tapes.ttf") format("truetype");
      font-weight:400;
      font-style:normal;
    }

    :root{
      --bg:#F7DD80;
      --text:#000;

      /* BIGGER overall sizing (responsive) */
      --fs-title: clamp(58px, 5.9vw, 92px);
      --fs-subtitle: clamp(34px, 3.3vw, 52px);
      --fs-goal: clamp(20px, 2.05vw, 32px);

      /* Bigger egg */
      --egg-w: min(82vw, 680px);

      /* symmetric spacing around egg */
      --egg-gap: 10px; /* <-- tweak this (e.g. 8px / 12px) */

      /* animation */
      --ease: cubic-bezier(.2,.8,.2,1);
      --t-move: 620ms;
      --t-fade: 520ms;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family:"Alphabetized Cassette Tapes","Comic Sans MS",system-ui,sans-serif;
      color:var(--text);
    }

    /* stable viewport center, no jitter on zoom */
    #app{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      display:grid;
      place-items:center;
    }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      max-width:1400px;
    }

    /* --- The ONE moving container: both pages slide together --- */
    #pages{
      position:absolute;
      inset:0;
      height:200vh;               /* 2 pages stacked */
      width:100%;
      transform: translateY(0);
      transition: transform var(--t-move) var(--ease);
      will-change: transform;
    }

    body.mode-goals #pages{
      transform: translateY(-100vh);
    }

    /* Each page takes exactly one viewport height */
    .scene{
      height:100vh;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Fade the outgoing/incoming content (still moves with the page) */
    .sceneInner{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      will-change: opacity;
      transition: opacity var(--t-fade) ease;
    }

    #introInner{ opacity:1; }
    #goalsInner{ opacity:0; }

    body.mode-goals #introInner{ opacity:0; }
    body.mode-goals #goalsInner{ opacity:1; }

    /* ---------- INTRO ---------- */
    #topText{
      font-size:var(--fs-title);
      line-height:1.05;
      text-align:center;
      padding:0 16px;
      margin-bottom: var(--egg-gap);   /* symmetric spacing above egg */
    }

    #eggHolder{
      width:var(--egg-w);
      margin:0;
    }
    #eggHolder svg{ width:100%; height:auto; display:block; }

    #breakTextIntro{
      font-size:var(--fs-title);
      line-height:1.05;
      text-align:center;
      padding:0 16px;
      margin-top: var(--egg-gap);      /* symmetric spacing below egg */
      white-space:nowrap;
    }

    /* ---------- GOALS ---------- */
    #goalsInner{
      justify-content:flex-start;
    }

    #goalsHeader{
      width:100%;
      display:flex;
      justify-content:center;
      padding-top:18px;
      padding-bottom:10px;
      box-sizing:border-box;
    }

    #breakTextGoals{
      font-size:var(--fs-title);
      line-height:1.05;
      text-align:center;
      padding:0 16px;
      white-space:nowrap;
    }

    #goalsBody{
      flex:1;
      width:100%;
      min-height:0;
      display:flex;
      justify-content:center;
      align-items:center; /* goals centered regardless of zoom */
      overflow-y:auto;
      padding:10px 14px 18px;
      box-sizing:border-box;
      scrollbar-gutter: stable both-edges;
    }

    #goalsPanel{
      width:min(96vw, 1200px);
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
      padding:2px 0 10px;
    }

    .section{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }

    .subtitle{
      font-size:var(--fs-subtitle);
      line-height:1.05;
      text-align:center;
    }

    .goalsRow{
      width:100%;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:nowrap;
      overflow-x:auto;
      padding:3px 6px 2px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:thin;
    }

    .goal{
      flex:0 0 auto;
      min-width:110px;
      text-align:center;
    }

    .goalLabel{
      font-size:var(--fs-goal);
      line-height:1.05;
      white-space:nowrap;
    }

    /* tiny progress bars */
    .bar{
      margin:6px auto 0;
      width:30px;
      height:3px;
      background:#fff;
      border:2px solid #000;
      border-radius:999px;
      overflow:hidden;
    }
    .fill{ height:100%; width:calc(var(--pct, 0) * 1%); background:#000; }

    @media (prefers-reduced-motion: reduce){
      #pages, .sceneInner{ transition:none !important; }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="stage">
      <div id="pages">
        <!-- PAGE 1: INTRO -->
        <div class="scene" id="introScene">
          <div class="sceneInner" id="introInner">
            <div id="topText">you wanna make an omelette</div>
            <div id="eggHolder" aria-hidden="true"></div>
            <div id="breakTextIntro">you gotta break some eggs</div>
          </div>
        </div>

        <!-- PAGE 2: GOALS -->
        <div class="scene" id="goalsScene" aria-hidden="true">
          <div class="sceneInner" id="goalsInner">
            <div id="goalsHeader">
              <div id="breakTextGoals">you gotta break some eggs</div>
            </div>
            <div id="goalsBody">
              <div id="goalsPanel"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import { EGG_ART } from "./egg-art.js";

    // egg SVG
    document.getElementById("eggHolder").innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="egg">
        <g>
          <path d="${EGG_ART.whitePath}" fill="#F7FCF6" stroke="#000" stroke-width="12"
                stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${EGG_ART.yolk.cx}" cy="${EGG_ART.yolk.cy}" r="${EGG_ART.yolk.r}"
                  fill="#F5C966" stroke="#000" stroke-width="12"/>
          <ellipse cx="${EGG_ART.eyeL.cx}" cy="${EGG_ART.eyeL.cy}" rx="${EGG_ART.eyeL.rx}" ry="${EGG_ART.eyeL.ry}" fill="#000"/>
          <ellipse cx="${EGG_ART.eyeR.cx}" cy="${EGG_ART.eyeR.cy}" rx="${EGG_ART.eyeR.rx}" ry="${EGG_ART.eyeR.ry}" fill="#000"/>
          <path d="${EGG_ART.mouthPath}" fill="none" stroke="#000" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    `;

    // ====== EDIT THESE PERCENTAGES (0–100) ======
    const PROGRESS = {
      "analysis ii": 0, "prob n stats": 0, "theo inf": 0,
      "sub20 5km": 0, "handstand": 0, "roundoff-spring": 0, "muscle-up": 0, "six pack": 0,
      "splits": 0, "dunk": 0, "back lever": 0, "dragonfly": 0,
      "german": 0, "italian": 0, "portuguese": 0, "korean": 0, "chinese": 0,
      "dice problems": 0, "green book": 0, "heard on the street": 0, "quant job qna": 0,
      "akuna 101": 0, "akuna 201": 0, "optiver book": 0, "optiver c.k.": 0, "poker m.c.": 0,
      "leetcode 150": 0, "eth algo lab": 0,
      "eprog": 0, "data n algs": 0, "linalg": 0, "diskmath": 0, "paraprog": 0,
      "algos n prob": 0, "analysis i": 0, "ddca": 0
    };

    const SECTIONS = [
      { subtitle: "exam egg",  goals: ["analysis ii","prob n stats","theo inf"] },
      { subtitle: "abs egg",   goals: ["sub20 5km","handstand","roundoff-spring","muscle-up","six pack","splits","dunk","back lever","dragonfly"] },
      { subtitle: "spy egg",   goals: ["german","italian","portuguese","korean","chinese"] },
      { subtitle: "quant egg", goals: ["dice problems","green book","heard on the street","quant job qna","akuna 101","akuna 201","optiver book","optiver c.k.","poker m.c."] },
      { subtitle: "coder egg", goals: ["leetcode 150","eth algo lab"] },
      { subtitle: "mit egg",   goals: ["eprog","data n algs","linalg","diskmath","paraprog","algos n prob","analysis i","ddca"] }
    ];

    function clampPct(v){
      const n = Number(v);
      if (!Number.isFinite(n)) return 0;
      return Math.max(0, Math.min(100, n));
    }

    function renderGoals(){
      document.getElementById("goalsPanel").innerHTML = SECTIONS.map(sec => {
        const goals = sec.goals.map(name => {
          const pct = clampPct(PROGRESS[name] ?? 0);
          return `
            <div class="goal">
              <div class="goalLabel">${name}</div>
              <div class="bar"><div class="fill" style="--pct:${pct}"></div></div>
            </div>
          `;
        }).join("");
        return `
          <div class="section">
            <div class="subtitle">${sec.subtitle}</div>
            <div class="goalsRow">${goals}</div>
          </div>
        `;
      }).join("");
    }
    renderGoals();

    // --- page toggle (single vertical flow for EVERYTHING) ---
    const goalsScene = document.getElementById("goalsScene");
    let goalsMode = false;

    function enterGoals(){
      if (goalsMode) return;
      goalsMode = true;
      document.body.classList.add("mode-goals");
      goalsScene.setAttribute("aria-hidden","false");
    }
    function leaveGoals(){
      if (!goalsMode) return;
      goalsMode = false;
      document.body.classList.remove("mode-goals");
      window.setTimeout(() => goalsScene.setAttribute("aria-hidden","true"), 650);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown"){ e.preventDefault(); enterGoals(); }
      if (e.key === "ArrowUp"){   e.preventDefault(); leaveGoals(); }
    }, { passive:false });
  </script>
</body>
</html>
