<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Omelette</title>

  <style>
    @font-face{
      font-family:"Alphabetized Cassette Tapes";
      src:url("./Alphabetized Cassette Tapes.ttf") format("truetype");
      font-weight:400;
      font-style:normal;
    }

    :root{
      --bg:#F7DD80;
      --text:#000;

      /* sizing */
      --fs-title: clamp(56px, 5.6vw, 88px);
      --fs-subtitle: clamp(34px, 3.2vw, 50px);
      --fs-goal: clamp(20px, 2.0vw, 30px);

      --egg-w: min(80vw, 640px);

      /* auto-set in JS */
      --egg-gap: 48px;

      /* animation */
      --ease: cubic-bezier(.2,.8,.2,1);
      --t-move: 560ms;
      --t-fade: 420ms;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family:"Alphabetized Cassette Tapes","Comic Sans MS",system-ui,sans-serif;
      color:var(--text);
    }

    #app{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      max-width:1400px;
      max-height:100%;
    }

    /* ---------- SHARED LAYER ---------- */
    #sharedLayer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:50;
    }

    #breakText{
      position:absolute;
      left:50%;
      top:0;
      transform: translate(-50%, 0);
      font-size:var(--fs-title);
      line-height:1.05;
      text-align:center;
      padding:0 16px;
      will-change: transform, opacity;
      transition: transform var(--t-move) var(--ease), opacity var(--t-fade) ease;
      white-space:nowrap;
    }

    .breakAnchor{
      width:100%;
      height: var(--break-h, 0px);
    }

    /* ---------- INTRO ---------- */
    #introScene{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:0; /* we control spacing explicitly */
      will-change: transform, opacity;
      transition: transform var(--t-move) var(--ease), opacity var(--t-fade) ease;
    }

    /* top text sits egg-gap ABOVE egg */
    #topText{
      font-size:var(--fs-title);
      line-height:1.05;
      text-align:center;
      padding:0 16px;
      margin: 0 0 var(--egg-gap) 0;
    }

    #eggHolder{
      width:var(--egg-w);
      margin:0;
    }
    #eggHolder svg{ width:100%; height:auto; display:block; }

    /* anchor sits egg-gap BELOW egg, defining breakText position */
    #introBreakAnchor{
      margin-top: var(--egg-gap);
    }

    /* ---------- GOALS ---------- */
    #goalsScene{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      opacity:0;
      pointer-events:none;
      transform: translateY(80px);
      will-change: transform, opacity;
      transition: transform var(--t-move) var(--ease), opacity var(--t-fade) ease;
    }

    #goalsHeader{
      padding-top:18px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    #goalsBody{
      flex:1;
      min-height:0;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow-y:auto;
      padding:10px 14px 14px;
      box-sizing:border-box;
      scrollbar-gutter: stable both-edges;
    }

    #goalsPanel{
      width:min(96vw, 1200px);
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
      padding:2px 0 10px;
    }

    .section{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }

    .subtitle{
      font-size:var(--fs-subtitle);
      line-height:1.05;
      text-align:center;
    }

    .goalsRow{
      width:100%;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:nowrap;
      overflow-x:auto;
      padding:3px 6px 2px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:thin;
    }

    .goal{ flex:0 0 auto; min-width:110px; text-align:center; }
    .goalLabel{ font-size:var(--fs-goal); line-height:1.05; white-space:nowrap; }

    .bar{
      margin:6px auto 0;
      width:30px;
      height:3px;
      background:#fff;
      border:2px solid #000;
      border-radius:999px;
      overflow:hidden;
    }
    .fill{ height:100%; width:calc(var(--pct, 0) * 1%); background:#000; }

    /* ---------- MODE ---------- */
    body.mode-goals #introScene{
      opacity:0;
      transform: translateY(-90px);
      pointer-events:none;
    }
    body.mode-goals #goalsScene{
      opacity:1;
      transform: translateY(0);
      pointer-events:auto;
    }

    @media (prefers-reduced-motion: reduce){
      #introScene, #goalsScene, #breakText{ transition:none !important; }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="stage">
      <div id="sharedLayer">
        <div id="breakText">you gotta break some eggs</div>
      </div>

      <div id="introScene">
        <div id="topText">you wanna make an omelette</div>
        <div id="eggHolder" aria-hidden="true"></div>
        <div id="introBreakAnchor" class="breakAnchor" aria-hidden="true"></div>
      </div>

      <div id="goalsScene" aria-hidden="true">
        <div id="goalsHeader">
          <div id="goalsBreakAnchor" class="breakAnchor" aria-hidden="true"></div>
        </div>
        <div id="goalsBody">
          <div id="goalsPanel"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { EGG_ART } from "./egg-art.js";

    // egg SVG
    document.getElementById("eggHolder").innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="egg">
        <g>
          <path d="${EGG_ART.whitePath}" fill="#F7FCF6" stroke="#000" stroke-width="12"
                stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${EGG_ART.yolk.cx}" cy="${EGG_ART.yolk.cy}" r="${EGG_ART.yolk.r}"
                  fill="#F5C966" stroke="#000" stroke-width="12"/>
          <ellipse cx="${EGG_ART.eyeL.cx}" cy="${EGG_ART.eyeL.cy}" rx="${EGG_ART.eyeL.rx}" ry="${EGG_ART.eyeL.ry}" fill="#000"/>
          <ellipse cx="${EGG_ART.eyeR.cx}" cy="${EGG_ART.eyeR.cy}" rx="${EGG_ART.eyeR.rx}" ry="${EGG_ART.eyeR.ry}" fill="#000"/>
          <path d="${EGG_ART.mouthPath}" fill="none" stroke="#000" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    `;

    function clampPct(v){
      const n = Number(v);
      if (!Number.isFinite(n)) return 0;
      return Math.max(0, Math.min(100, n));
    }

    function renderGoals({ sections, progress }){
      const panel = document.getElementById("goalsPanel");
      panel.innerHTML = sections.map(sec => {
        const goals = sec.goals.map(name => {
          const pct = clampPct(progress?.[name] ?? 0);
          return `
            <div class="goal">
              <div class="goalLabel">${name}</div>
              <div class="bar"><div class="fill" style="--pct:${pct}"></div></div>
            </div>
          `;
        }).join("");
        return `
          <div class="section">
            <div class="subtitle">${sec.subtitle}</div>
            <div class="goalsRow">${goals}</div>
          </div>
        `;
      }).join("");
    }

    async function loadGoalsData(){
      const res = await fetch("./goals-data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load goals-data.json");
      return await res.json();
    }

    try{
      const data = await loadGoalsData();
      renderGoals(data);
    }catch(err){
      console.error(err);
      document.getElementById("goalsPanel").innerHTML =
        `<div style="font-size:20px; padding:16px; text-align:center;">
          couldn't load <b>goals-data.json</b><br/>
          make sure it's in the same folder as <b>index.html</b>
        </div>`;
    }

    // ---- transition anchor logic ----
    const app = document.getElementById("app");
    const breakText = document.getElementById("breakText");
    const introAnchor = document.getElementById("introBreakAnchor");
    const goalsAnchor = document.getElementById("goalsBreakAnchor");
    const goalsScene  = document.getElementById("goalsScene");
    const topTextEl   = document.getElementById("topText");

    let goalsMode = false;

    function maxStrokeWidth(svg){
      let max = 0;
      svg.querySelectorAll("[stroke-width]").forEach(el => {
        const v = parseFloat(el.getAttribute("stroke-width"));
        if (Number.isFinite(v)) max = Math.max(max, v);
      });
      return max || 0;
    }

    function eggDrawingHeightPx(){
      const svg = document.querySelector("#eggHolder svg");
      if (!svg) return 0;

      // actual drawn bounds (no whitespace)
      const g = svg.querySelector("g") || svg;

      let bbox;
      try{
        bbox = g.getBBox(); // SVG units
      }catch{
        // fallback
        return svg.getBoundingClientRect().height;
      }

      const vb = svg.viewBox?.baseVal;
      if (!vb || !vb.height) return svg.getBoundingClientRect().height;

      const rendered = svg.getBoundingClientRect();
      const scaleY = rendered.height / vb.height;

      // bbox doesn't include stroke, so pad by max stroke width (roughly)
      const stroke = maxStrokeWidth(svg);
      const K = (bbox.height + stroke) * scaleY;

      return K;
    }

    function syncEggGap(){
      // ideal gap is K/3 (your rule)
      const K = eggDrawingHeightPx();
      if (!(K > 0)) return;

      const ideal = K / 3;

      // BUT if it would push off-screen, cap to what fits.
      // This replaces "negative margin hacks" with a stable auto-fit.
      const breakH = breakText.getBoundingClientRect().height || 0;
      const topH   = topTextEl.getBoundingClientRect().height || 0;
      const vh     = window.innerHeight || 0;

      // available space for the two gaps combined
      const availableForGaps = Math.max(0, vh - (topH + K + breakH));

      // gap must be <= half of that to keep everything inside viewport
      const maxGapThatFits = availableForGaps / 2;

      // keep a small floor so it never collapses to 0
      const gap = Math.max(8, Math.min(ideal, maxGapThatFits));

      document.documentElement.style.setProperty("--egg-gap", `${gap}px`);
    }

    function syncAnchorHeights(){
      const h = Math.ceil(breakText.getBoundingClientRect().height);
      document.documentElement.style.setProperty("--break-h", h + "px");
    }

    function placeBreakText(animate){
      const anchor = goalsMode ? goalsAnchor : introAnchor;
      const appRect = app.getBoundingClientRect();
      const aRect = anchor.getBoundingClientRect();
      const btRect = breakText.getBoundingClientRect();

      const y = (aRect.top - appRect.top) + (aRect.height - btRect.height) / 2;

      if (!animate){
        const prev = breakText.style.transition;
        breakText.style.transition = "none";
        breakText.style.transform = `translate(-50%, ${y}px)`;
        requestAnimationFrame(() => { breakText.style.transition = prev; });
      } else {
        breakText.style.transform = `translate(-50%, ${y}px)`;
      }
    }

    function layoutNow(animateBreakText = false){
      syncEggGap();        // <-- now K is true egg bounds and gap is auto-fit
      syncAnchorHeights();
      placeBreakText(animateBreakText);
    }

    // initial (after font load for accurate heights)
    const fontsReady = document.fonts?.ready?.catch(() => null);
    if (fontsReady) await fontsReady;

    requestAnimationFrame(() => requestAnimationFrame(() => layoutNow(false)));

    window.addEventListener("resize", () => {
      requestAnimationFrame(() => requestAnimationFrame(() => layoutNow(false)));
    });

    function enterGoals(){
      if (goalsMode) return;
      goalsMode = true;
      document.body.classList.add("mode-goals");
      goalsScene.setAttribute("aria-hidden","false");
      requestAnimationFrame(() => requestAnimationFrame(() => layoutNow(true)));
    }

    function leaveGoals(){
      if (!goalsMode) return;
      goalsMode = false;
      document.body.classList.remove("mode-goals");
      requestAnimationFrame(() => requestAnimationFrame(() => layoutNow(true)));
      window.setTimeout(() => goalsScene.setAttribute("aria-hidden","true"), 600);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown"){ e.preventDefault(); enterGoals(); }
      if (e.key === "ArrowUp"){   e.preventDefault(); leaveGoals(); }
    }, { passive:false });
  </script>
</body>
</html>
