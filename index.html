<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Omelette</title>

  <style>
    @font-face {
      font-family: "Alphabetized Cassette Tapes";
      src: url("./Alphabetized Cassette Tapes.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    :root{
      --bg: #F7DD80;
      --text: #000;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body{
      display: grid;
      place-items: center;
      font-family: "Alphabetized Cassette Tapes", "Comic Sans MS", system-ui, sans-serif;
      color: var(--text);
    }

    .wrap{
      width: min(92vw, 820px);
      display: grid;
      gap: 18px;
      justify-items: center;
    }

    /* SVG sizing */
    svg{
      width: 100%;
      height: auto;
      display: block;
    }

    /* Smooth mode transitions */
    #topText, #bottomText, #eggGroup{
      transition: transform 520ms ease, opacity 420ms ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    /* Goals panel */
    #goalsPanel{
      width: 100%;
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: opacity 420ms ease, transform 520ms ease;
    }

    .section{
      margin: 10px 0 16px;
    }

    .subtitle{
      font-size: 34px;
      line-height: 1.05;
      margin: 0 0 10px;
      text-align: center;
    }

    .goalsRow{
      display: flex;
      flex-wrap: nowrap;          /* keep in one line */
      gap: 14px;
      overflow-x: auto;           /* if too many goals, you can scroll sideways */
      padding: 6px 2px 10px;
      -webkit-overflow-scrolling: touch;
    }

    .goal{
      flex: 0 0 auto;
      min-width: 110px;
      text-align: center;
    }

    .goalLabel{
      font-size: 18px;
      line-height: 1.05;
      white-space: nowrap;
    }

    .bar{
      margin: 8px auto 0;
      width: 96px;
      height: 10px;
      background: #fff;
      border: 2px solid #000;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill{
      height: 100%;
      width: calc(var(--pct, 0) * 1%);
      background: #000;
    }

    /* --- MODE: goals (ArrowDown) --- */
    .mode-goals #topText{
      opacity: 0;
      transform: translateY(-160px);
    }

    .mode-goals #eggGroup{
      opacity: 0;
      transform: translateY(-240px);
    }

    /* move "you gotta break some eggs" up to title position */
    .mode-goals #bottomText{
      transform: translateY(-660px);
    }

    .mode-goals #goalsPanel{
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* little hint (optional) */
    .hint{
      font-size: 14px;
      opacity: 0.55;
      text-align: center;
      margin-top: -8px;
      user-select: none;
    }
  </style>
</head>

<body>
  <div class="wrap" id="app">
    <div id="svgHost"></div>

    <div id="goalsPanel" aria-hidden="true"></div>

    <div class="hint">Press ↓ for goals, ↑ to go back</div>
  </div>

  <script type="module">
    import { EGG_ART } from "./egg-art.js";

    // ====== EDIT THESE PERCENTAGES (0–100) ======
    const PROGRESS = {
      "analysis ii": 0,
      "prob n stats": 0,
      "theo inf": 0,

      "sub20 5km": 0,
      "handstand": 0,
      "roundoff-spring": 0,
      "muscle-up": 0,
      "six pack": 0,
      "splits": 0,
      "dunk": 0,
      "back lever": 0,
      "dragonfly": 0,

      "german": 0,
      "italian": 0,
      "portuguese": 0,
      "korean": 0,
      "chinese": 0,

      "dice problems": 0,
      "green book": 0,
      "heard on the street": 0,
      "quant job qna": 0,
      "akuna 101": 0,
      "akuna 201": 0,
      "optiver book": 0,
      "optiver c.k.": 0,
      "poker m.c.": 0,

      "leetcode 150": 0,
      "eth algo lab": 0,

      "eprog": 0,
      "data n algs": 0,
      "linalg": 0,
      "diskmath": 0,
      "paraprog": 0,
      "algos n prob": 0,
      "analysis i": 0,
      "ddca": 0
    };

    const SECTIONS = [
      { subtitle: "exam egg", goals: ["analysis ii", "prob n stats", "theo inf"] },
      { subtitle: "abs egg", goals: ["sub20 5km", "handstand", "roundoff-spring", "muscle-up", "six pack", "splits", "dunk", "back lever", "dragonfly"] },
      { subtitle: "spy egg", goals: ["german", "italian", "portuguese", "korean", "chinese"] },
      { subtitle: "quant egg", goals: ["dice problems", "green book", "heard on the street", "quant job qna", "akuna 101", "akuna 201", "optiver book", "optiver c.k.", "poker m.c."] },
      { subtitle: "coder egg", goals: ["leetcode 150", "eth algo lab"] },
      { subtitle: "mit egg", goals: ["eprog", "data n algs", "linalg", "diskmath", "paraprog", "algos n prob", "analysis i", "ddca"] }
    ];

    // ====== SVG markup (uses imported egg numbers) ======
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Omelette quote card">
        <defs>
          <style>
            .hand { font-family: "Alphabetized Cassette Tapes", "Comic Sans MS", system-ui, sans-serif; font-weight: 400; fill: #000; }
          </style>
        </defs>

        <rect width="1080" height="1080" fill="#F7DD80"/>

        <!-- top text -->
        <text id="topText" class="hand" x="540" y="215" font-size="111" text-anchor="middle">
          you wanna make an omelette
        </text>

        <!-- egg -->
        <g id="eggGroup">
          <path d="${EGG_ART.whitePath}"
                fill="#F7FCF6" stroke="#000" stroke-width="12"
                stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${EGG_ART.yolk.cx}" cy="${EGG_ART.yolk.cy}" r="${EGG_ART.yolk.r}"
                  fill="#F5C966" stroke="#000" stroke-width="12"/>
          <ellipse cx="${EGG_ART.eyeL.cx}" cy="${EGG_ART.eyeL.cy}" rx="${EGG_ART.eyeL.rx}" ry="${EGG_ART.eyeL.ry}" fill="#000"/>
          <ellipse cx="${EGG_ART.eyeR.cx}" cy="${EGG_ART.eyeR.cy}" rx="${EGG_ART.eyeR.rx}" ry="${EGG_ART.eyeR.ry}" fill="#000"/>
          <path d="${EGG_ART.mouthPath}" fill="none" stroke="#000" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- bottom text (this becomes the title in goals mode) -->
        <text id="bottomText" class="hand" x="540" y="875" font-size="123" text-anchor="middle">
          you gotta break some eggs
        </text>
      </svg>
    `;
    document.getElementById("svgHost").innerHTML = svg;

    // ====== Build goals UI ======
    function clampPct(v){
      const n = Number(v);
      if (!Number.isFinite(n)) return 0;
      return Math.max(0, Math.min(100, n));
    }

    function renderGoals(){
      const panel = document.getElementById("goalsPanel");
      panel.innerHTML = SECTIONS.map(sec => {
        const goals = sec.goals.map(name => {
          const pct = clampPct(PROGRESS[name] ?? 0);
          return `
            <div class="goal">
              <div class="goalLabel">${name}</div>
              <div class="bar"><div class="fill" style="--pct:${pct}"></div></div>
            </div>
          `;
        }).join("");

        return `
          <div class="section">
            <div class="subtitle">${sec.subtitle}</div>
            <div class="goalsRow">${goals}</div>
          </div>
        `;
      }).join("");
    }
    renderGoals();

    // ====== Mode toggle (ArrowDown / ArrowUp) ======
    const app = document.getElementById("app");
    let goalsMode = false;

    function setMode(on){
      goalsMode = !!on;
      document.body.classList.toggle("mode-goals", goalsMode);
      document.getElementById("goalsPanel").setAttribute("aria-hidden", String(!goalsMode));
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") setMode(true);
      if (e.key === "ArrowUp") setMode(false);
    });

    // optional: click toggles (nice on mobile)
    window.addEventListener("click", (e) => {
      // avoid toggling when the user is scrolling the goals row
      const inGoalsRow = e.target.closest && e.target.closest(".goalsRow");
      if (inGoalsRow) return;
      setMode(!goalsMode);
    });
  </script>
</body>
</html>
